---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sumancloud-app
  labels:
    app: sumancloud-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sumancloud-app
  template:
    metadata:
      labels:
        app: sumancloud-app
    spec:
      containers:
      - name: sumancloud-container
        image: 776502241773.dkr.ecr.us-east-1.amazonaws.com/amazon-prime:latest
        ports:
        - containerPort: 3000
...
